<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Game</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #0b0f1a;
      color: #d7e3ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      height: 100%;
    }

    .wrap {
      display: grid;
      place-items: center;
      min-height: 100%;
      gap: 10px;
      padding: 12px;
      box-sizing: border-box;
    }

    canvas {
      background: #000;
      border: 1px solid #2a3550;
      max-width: 100%;
      height: auto;
      display: block;
      outline: none;
    }

    canvas:focus {
      box-shadow: 0 0 0 2px #4c8dff;
    }

    .hud {
      width: min(1136px, 95vw);
      font-size: 13px;
      line-height: 1.4;
      opacity: 0.95;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .keys code {
      background: #1a2338;
      border: 1px solid #31415f;
      border-radius: 4px;
      padding: 1px 6px;
      margin-right: 4px;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <canvas id="game" width="1136" height="640" tabindex="0" aria-label="Space game canvas"></canvas>

    <div class="hud">
      <div class="keys">
        <strong>Controls:</strong>
        <code>W</code>/<code>S</code> or <code>↑</code>/<code>↓</code> Move
        <code>Space</code> Shoot
        <code>P</code> Debug
        <code>K</code>/<code>L</code> Speed -
        <code>O</code> Parallax seams
      </div>
      <div id="focusState">Input: not focused</div>
    </div>
  </div>

  <script type="module">
    import { Game } from "./src/game.js";

    const canvas = document.getElementById("game");
    const focusState = document.getElementById("focusState");

    // Ensure canvas can receive keyboard input
    const focusCanvas = () => {
      canvas.focus({ preventScroll: true });
      focusState.textContent = (document.activeElement === canvas)
        ? "Input: canvas focused"
        : "Input: not focused";
    };

    canvas.addEventListener("pointerdown", focusCanvas);
    canvas.addEventListener("click", focusCanvas);
    window.addEventListener("load", focusCanvas);

    // Optional fallback: keep focus when user clicks anywhere in page background
    document.addEventListener("pointerdown", (e) => {
      if (e.target === document.body || e.target === document.documentElement) {
        focusCanvas();
      }
    });

    // Prevent page scrolling on game keys
    window.addEventListener("keydown", (e) => {
      const block = ["ArrowUp", "ArrowDown", " ", "Spacebar"];
      if (block.includes(e.key)) e.preventDefault();
    }, { passive: false });

    const game = new Game(canvas);
    game.start();
  </script>
</body>

</html>
